name: Windows

on:
  push:
    branches: [modernize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    outputs:
      is_release: ${{ steps.export.outputs.is_release }}
      git_describe: ${{ steps.export.outputs.git_describe }}

    strategy:
      matrix:
        include:
          - name: Windows x64
            platform: x64
            arch: amd64
            preset: windows-x64-release
          - name: Windows x64-avx2
            platform: x64
            arch: amd64
            name_postfix: "-avx2"
            preset: windows-x64-avx2-release
          - name: Windows x86
            platform: x86
            arch: amd64_x86
            preset: windows-x86-release
          - name: Windows ARM64
            platform: arm64
            arch: amd64_arm64
            preset: windows-arm64-release

    steps:
      - name: Fetch repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Get cmake and ninja
        uses: lukka/get-cmake@v4.4.0

      - name: Find MSVC (on Windows)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Export Environment
        id: export
        shell: pwsh
        run: .\.github\scripts\windows-environment.ps1 '${{ matrix.platform }}${{ matrix.name_postfix }}'

      - name: Restore artifacts, or setup vcpkg (do not install any package)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: external/vcpkg/vcpkg
          vcpkgJsonGlob: external/vcpkg/config/vcpkg.json
          prependedCacheKey: "Windows/${{ matrix.platform }}${{ matrix.name_postfix }}"

      - name: Configure
        shell: cmd
        run: >
          cmake -G Ninja --preset "${{ matrix.preset }}"
          "-DTARGET_MSI_NAME=%PROJECT_OUTPUT_NAME%"
          -S "%PROJECT_SOURCE%"
          -B "${{ env.PROJECT_BUILD }}"

      - name: Compile
        shell: cmd
        working-directory: "${{ env.PROJECT_BUILD }}"
        run: cmake --build .

      - name: Block cache on failure
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: echo "RUNVCPKG_NO_CACHE=1" >> $GITHUB_ENV

      - name: Test
        if: matrix.platform != 'arm64'
        shell: cmd
        working-directory: "${{ env.PROJECT_BUILD }}"
        run: cmake --build . --target test

      - name: Build Installer
        shell: cmd
        working-directory: "${{ env.PROJECT_BUILD }}"
        run: cpack -G ZIP -v

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_ZIP_NAME }}
          path: ${{ env.PROJECT_ZIP }}

  release:
    needs: build

    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: .

      - name: Create Prerelease
        if: contains(github.ref, 'modernize')
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: latest-windows
          name: "Latest CI/canary Windows dunelegacy ${{ needs.build.outputs.git_describe }}"
          draft: false
          prerelease: true
          files: |
            **/*.zip

      - name: Create Release
        if: needs.build.outputs.is_release == 'True'
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          name: "Windows dunelegacy ${{ needs.build.outputs.git_describe }}"
          files: |
            **/*.zip
          draft: true
          prerelease: false
