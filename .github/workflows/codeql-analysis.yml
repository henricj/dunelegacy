name: "CodeQL"

on:
  push:
    branches: [modernize, master]
  pull_request:
    branches: [modernize]
  schedule:
    - cron: "20 19 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["cpp"]

    steps:
      - name: Fetch repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Get cmake and ninja
        uses: lukka/get-cmake@v4.4.2

      - name: Install packages
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          autoconf autoconf-archive automake libtool libltdl-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
          libxi-dev libxss-dev libxtst-dev libgl1-mesa-dev
          libwayland-dev libxkbcommon-dev libegl1-mesa-dev
          libibus-1.0-dev

      - name: Restore artifacts, or setup vcpkg (do not install any package)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: external/vcpkg/vcpkg
          vcpkgJsonGlob: external/vcpkg/config-sdl3/vcpkg.json
          prependedCacheKey: "build-linux-release-sdl3"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Configure
        run: >
          cmake --preset=linux-release
          -DVCPKG_MANIFEST_DIR="${{ github.workspace }}/external/vcpkg/config-sdl3"

      - name: Build
        run: cmake --build out/build/linux-release

      - name: Block cache on failure
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: echo "RUNVCPKG_NO_CACHE=1" >> $GITHUB_ENV

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
